<style>
  :root{
    --paper:#EFECE6;
    --panel:#FAF8F4;
    --panel-2:#F1EEE7;
    --ink:#201F1D;
    --ink-dim:#79766F;
    --line:#D8D3C8;
    --aluminum:#B7B4AC;
    --grid-line:rgba(53,87,160,0.10);
    --good:#4C7A52;
    --bad:#C0402C;

    --accent-tuner:#3557A0;
    --accent-metro:#C0402C;
    --accent-chords:#4C7A52;
    --accent-scales:#C99A2E;
    --accent-ear:#B5652E;
    --accent-journal:#4A4842;

    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%; overscroll-behavior:none;}
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 28px);
    overflow:hidden;
  }
  .scroll-area{
    height:100vh;
    height:100dvh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
  a{color:var(--ink); text-decoration-color:var(--aluminum);}
  button{font-family:inherit;}
  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  .app{
    display:grid;
    grid-template-columns:220px minmax(0,1fr);
    min-height:100%;
  }
  @media (max-width:820px), (max-height:500px){
    .app{grid-template-columns:minmax(0,1fr);}
  }

  /* ---------- Jack nav ---------- */
  .pegs{
    background:var(--panel-2);
    border-right:1px solid var(--line);
    padding:28px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  @media (max-width:820px), (max-height:500px){
    .pegs{
      position:fixed;
      left:0; right:0; bottom:54px;
      max-height:min(70vh, 480px);
      overflow-y:auto;
      flex-direction:column;
      gap:0;
      background:var(--panel);
      border:none;
      border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;
      box-shadow:0 -10px 30px rgba(32,31,29,0.18);
      padding:10px 0 6px;
      transform:translateY(16px);
      opacity:0;
      pointer-events:none;
      transition:transform 0.2s ease, opacity 0.2s ease;
      z-index:45;
    }
    body.nav-open .pegs{
      transform:translateY(0);
      opacity:1;
      pointer-events:auto;
    }
  }

  .nav-footer{
    margin-top:auto;
    padding:14px 12px 4px;
    border-top:1px solid var(--line);
  }
  @media (max-width:820px), (max-height:500px){
    .nav-footer{
      margin-top:8px;
      padding:14px 20px 6px;
    }
  }
  .wake-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
  }
  .wake-toggle-title{display:block; font-size:12.5px; font-weight:600; color:var(--ink);}
  .wake-toggle-sub{display:block; font-size:10.5px; color:var(--ink-dim); font-family:var(--font-mono); margin-top:2px;}
  .wake-toggle input{position:absolute; opacity:0; width:1px; height:1px;}
  .wake-switch{
    flex:none;
    width:38px; height:22px;
    border-radius:11px;
    background:var(--aluminum);
    position:relative;
    transition:background 0.15s;
  }
  .wake-switch::before{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    backg
